[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djlife"
version = "0.1.0"
description = "Catálogo e organização de biblioteca musical para DJs."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Bianca Reis Avalos" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "platformdirs>=4.2.0",
    "mutagen>=1.47.0",
    "tinytag>=1.10.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fingerprint = ["pyacoustid>=1.3.0"]
# Rekordbox: le/relink do master.db (SQLCipher) via pyrekordbox.
rekordbox = ["pyrekordbox>=0.4.0"]
# Analise de audio nativa (Windows/Linux/macOS): BPM + tonalidade via librosa.
analysis = ["librosa>=0.10", "soundfile>=0.12"]
# Essentia nao publica wheel para Windows: instalar apenas em Linux/WSL2/Docker.
essentia = ["essentia"]
# Embeddings de audio (camada L3): CLAP via transformers, roda em CPU.
ml = ["torch>=2.2", "transformers>=4.40", "librosa>=0.10", "soundfile>=0.12"]
dev = ["pytest>=8.0", "ruff>=0.5.0", "mypy>=1.10.0", "types-pyyaml>=6.0"]
# Empacotamento: gera o executavel onedir do nucleo enxuto (ver ADR-0016).
packaging = ["pyinstaller>=6.0"]

[project.scripts]
djlife = "djlife.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/djlife"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["djlife"]
mypy_path = "src"
strict = true
